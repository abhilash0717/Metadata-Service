version: "3.8"

services:
  metadata-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: metadata-service:latest
    container_name: metadata-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - kafka-net

networks:
  kafka-net:
    external: true
